      o += "</div></div></div>";

    o += "</div>";
    o += "<div style=\"display: flex; flex-direction: column; gap: 7px\"><label for=\"vl-o-name\" style=\"font-size: 12px; color: #E8C374; font-weight: 500\">Name</label><input id=\"vl-o-name\" class=\"vl-in\" type=\"text\" placeholder=\"Your name\" style=\"height: 52px; border-radius: 14px; border: 1px solid rgba(232,195,116,.45); background: #0B2A1C; color: #FBF4E6; padding: 0 16px; width: 100%\"></div>";

var handlers = [], root = document.getElementById('app'), comp, mounted = false, queued = false;
function reg(fn) { handlers.push(fn); return handlers.length - 1; }
function schedule() { if (queued) return; queued = true; requestAnimationFrame(function () { queued = false; draw(); }); }
function patchChildren(a, b) {
  a.innerHTML = b.innerHTML;
}
function draw() {
  handlers = [];
  var markup = TEMPLATE(comp.renderVals(), reg);
  var t = document.createElement('template');
  t.innerHTML = markup;
  if (!mounted) { root.innerHTML = ''; root.appendChild(t.content); mounted = true; }
  else { root.innerHTML = ''; root.appendChild(t.content); }
}
['click', 'pointerdown', 'keydown'].forEach(function (type) {
  document.addEventListener(type, function (e) {
    var el = e.target && e.target.closest ? e.target : (e.target && e.target.parentElement);
    while (el && el !== document) {
      var k = el.getAttribute && el.getAttribute('data-ev-' + type);
      if (k != null && handlers[+k]) {
        handlers[+k](e);
        break;
      }
      el = el.parentNode;
    }
  });
});
comp = new Component();
draw();
